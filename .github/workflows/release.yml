name: release

# A tag `v<version>` builds the wheel and the sdist from engine/ and publishes them to PyPI by
# trusted publishing (OIDC, environment `pypi`) — no token anywhere. The version tagged must be
# the version in engine/pyproject.toml, or the run refuses before it builds.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag is the version
        run: |
          v=$(grep -E '^version = ' engine/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "RELEASE REFUSED: tag ${GITHUB_REF_NAME} is not v$v (engine/pyproject.toml)"; exit 1; }
      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist engine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
