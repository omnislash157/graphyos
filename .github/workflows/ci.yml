name: ci

# The floor on two interpreters, then the departure gate — the same two commands the
# constitution names, run on a machine that has never seen the host.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install graphyos with the dev and typescript extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[dev,typescript]"
      - name: the package imports, no host reachable
        run: python -c "import graphy; print(graphy.__version__)"
      - name: the floor
        run: cd engine && pytest -q

  # The store lane on the platform that silently could not write one. `os.fsync` is `_commit` here
  # and refuses a descriptor not open for writing, so every `graphy build` died with EBADF and no
  # store was ever written — green on the Linux floor for the whole outage, found by a first
  # client's debugger (graphyos #77). This job is the `durable` mark and nothing else, ON PURPOSE:
  # the whole floor on windows-latest is 33 red (graphyos #88 carries the measured list), and a job
  # that is permanently red teaches a reader to ignore it. What is claimed here is exactly what is
  # proven here — the store is written, fsynced through a writable descriptor, and renamed — and
  # the README says the platform is otherwise unsupported rather than letting a stranger find out.
  # The second mark is the lock (graphyos #122): `_portable_flock` was a named no-op without `fcntl`,
  # so two concurrent journal appends minted one seq here; it is `msvcrt.locking` now, and the three
  # tests that measured the no-op red on this runner are the proof (the step collects them with the
  # helper's own tests and the lock tests beside them) — again exactly what is claimed.
  # The third mark is the handle (graphyos #124): a file this process still holds cannot be renamed
  # or replaced here, and every verb left its store open, so a rename of `.graphy` after an eat, the
  # recompile a stale refusal advertises and a rebuild's landing all read `WinError 5`. Every verb
  # closes what it opened now; the step runs the tracker over every verb and three of the four tests
  # that measured the violation on this runner (the fourth, test_rebuild's pruned-lane test, gets past
  # its rename here now and then fails on a separator assertion that is #88's, so it is not claimed).
  store-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install graphyos with the dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[dev]"
      - name: the package imports, no host reachable
        run: python -c "import graphy; print(graphy.__version__)"
      - name: the durable mark — the store survives a rename on this platform
        run: cd engine && pytest -m durable -q
      - name: the lock mark — a concurrent append blocks on this platform, never a duplicate seq
        run: cd engine && pytest -q tests/test_portable_flock.py tests/test_journal.py tests/test_mesh_federation.py tests/test_fanout.py -k "concurrent or lock or flock or host or errno or helper"
      - name: the handle mark — a verb closes its store, so the rename after it is never refused on this platform
        run: cd engine && pytest -q tests/test_store_lifecycle.py "tests/test_cli.py::test_GREEN_eat_no_provision_runs_nothing_of_the_repo_and_mints_an_empty_ring" "tests/test_federated_store.py::test_GREEN_advertised_warn_command_parses" "tests/test_federated_store.py::test_GREEN_advertised_refuse_command_parses"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the departure gate
        run: bash standalone_check.sh
      - name: the census
        run: bash census.sh
      - name: "the receipt (quick: the floor, the gate, the wheel)"
        run: |
          python -m venv .venv && .venv/bin/pip install -q -e "engine[dev,typescript,estate]" build twine
          python3 measure.py run --quick --out recon.json
      - uses: actions/upload-artifact@v4
        with:
          name: recon-${{ github.sha }}
          path: recon.json
